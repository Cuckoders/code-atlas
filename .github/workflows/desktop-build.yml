name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            id: macos-arm64
            os: macos-15
            bundles: dmg
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              dist-sidecar/build-manifest.json
          - name: macOS x64
            id: macos-x64
            os: macos-15-intel
            bundles: dmg
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              dist-sidecar/build-manifest.json
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              dist-sidecar/build-manifest.json
          - name: Windows x64
            id: windows-x64
            os: windows-2025
            bundles: msi,nsis
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              dist-sidecar/build-manifest.json

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build autonomous sidecar
        run: npm run build:sidecar

      - name: Smoke-test autonomous sidecar
        run: npm run test:sidecar

      - name: Build native bundles
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}

      - name: Upload native bundles
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: code-atlas-${{ matrix.id }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
