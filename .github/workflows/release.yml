name: Draft release

run-name: Draft release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string
      confirm_publish:
        description: Build signed packages and create a draft GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    if: inputs.confirm_publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release_commit: ${{ steps.release-ref.outputs.commit }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Verify tag and application versions
        env:
          CODE_ATLAS_RELEASE_TAG: ${{ inputs.tag }}
        run: npm run release:verify

      - name: Resolve immutable release commit
        id: release-ref
        env:
          CODE_ATLAS_RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          release_commit=$(git rev-list -n 1 "$CODE_ATLAS_RELEASE_TAG")
          checked_out_commit=$(git rev-parse HEAD)
          if [[ "$release_commit" != "$checked_out_commit" ]]; then
            echo 'Checked out commit does not match the release tag.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo 'Release tag must point to a commit reachable from origin/main.' >&2
            exit 1
          fi
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }}
    needs: validate
    environment: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Signed macOS arm64
            id: macos-arm64
            os: macos-15
            platform: macos
            bundles: dmg
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              dist-sidecar/build-manifest.json
          - name: Signed macOS x64
            id: macos-x64
            os: macos-15-intel
            platform: macos
            bundles: dmg
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              dist-sidecar/build-manifest.json
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              dist-sidecar/build-manifest.json
          - name: Windows x64
            id: windows-x64
            os: windows-2025
            platform: windows
            bundles: msi,nsis
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              dist-sidecar/build-manifest.json

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.release_commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release metadata
        env:
          CODE_ATLAS_RELEASE_TAG: ${{ inputs.tag }}
        run: npm run release:verify

      - name: Verify Apple signing and notarization secrets
        if: matrix.platform == 'macos'
        env:
          CODE_ATLAS_RELEASE_TAG: ${{ inputs.tag }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release:verify -- --apple-signing

      - name: Smoke-test autonomous sidecar
        run: npm run build:sidecar && npm run test:sidecar

      - name: Build signed and notarized macOS bundles
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}

      - name: Build native bundles
        if: matrix.platform != 'macos'
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}

      - name: Upload release candidates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: code-atlas-${{ matrix.id }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    name: Create draft GitHub Release
    needs: bundle
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release candidates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: code-atlas-*
          path: release-assets

      - name: Create checksums and draft release
        env:
          CODE_ATLAS_RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' release_files < <(
            find release-assets -type f \
              \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*.exe' \) \
              -print0 | sort -z
          )
          if (( ${#release_files[@]} == 0 )); then
            echo 'No release packages were downloaded.' >&2
            exit 1
          fi
          printf '%s\0' "${release_files[@]}" | xargs -0 sha256sum > SHA256SUMS.txt
          gh release create "$CODE_ATLAS_RELEASE_TAG" \
            "${release_files[@]}" \
            SHA256SUMS.txt \
            --draft \
            --generate-notes \
            --title "Code Atlas $CODE_ATLAS_RELEASE_TAG" \
            --verify-tag
