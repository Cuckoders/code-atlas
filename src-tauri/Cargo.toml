[package]
name = "code-atlas"
version = "0.1.0"
description = "Interactive desktop map of software architecture and source structure"
authors = ["Code Atlas"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "code_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
